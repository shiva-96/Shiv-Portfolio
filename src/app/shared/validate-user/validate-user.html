<section class="validation-modal" aria-labelledby="validation-title">
  <button
    class="close-button"
    type="button"
    aria-label="Close dialog"
    (click)="close()"
  >
    &times;
  </button>

  <p class="eyebrow">Access check</p>
  <h2 id="validation-title">Verify your role</h2>
  <p class="description">Select your role to continue.</p>

  <fieldset class="role-options">
    <legend class="sr-only">Your role</legend>
    <label class="role-option">
      <input
        type="radio"
        name="user-role"
        value="admin"
        [checked]="selectedRole() === 'admin'"
        (change)="selectRole('admin')"
      />
      <span>Admin</span>
    </label>
    <label class="role-option">
      <input
        type="radio"
        name="user-role"
        value="other"
        (change)="selectRole('other')"
      />
      <span>HR / Other</span>
    </label>
  </fieldset>

  @if (selectedRole() === 'admin') {
    <div class="security-key">
      <label for="security-key">Security key</label>
      <input
        id="security-key"
        type="password"
        autocomplete="current-password"
        placeholder="Enter your security key"
      />
    </div>
  }
</section>
