<div class="project-card">
  <div class="proj-top">
    <div class="proj-icon">{{ project().icon }}</div>
      <span class="proj-badge">{{ project().badge }}</span>
  </div>
    <h3 class="proj-title">{{ project().title }}</h3>
    <p class="proj-desc">{{ project().description }}</p>
  <div class="proj-tech">
      @for (tech of project().technologies; track $index) {
    <span class="tech-tag">{{ tech }}</span>
    }
  </div>
  @if (project().link; as link) {
    <button mat-icon-button class="proj-link" (click)="openLink(link)">
      <mat-icon>arrow_outward</mat-icon>
    </button>
  }
</div>
