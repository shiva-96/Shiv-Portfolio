<div class="project-card">
  <div class="proj-top">
    <div class="proj-icon">{{ project.icon }}</div>
    <span class="proj-badge">{{ project.badge }}</span>
  </div>
  <h3 class="proj-title">{{ project.title }}</h3>
  <p class="proj-desc">{{ project.description }}</p>
  <div class="proj-tech">
    <span *ngFor="let tech of project.technologies" class="tech-tag">{{ tech }}</span>
  </div>
  <button mat-icon-button class="proj-link" *ngIf="project.link" (click)="openLink(project.link)">
    <mat-icon>arrow_outward</mat-icon>
  </button>\n</div>
