<section id="contact" class="contact-section">
  <div class="contact-container">
    <div class="section-header">
      <span class="section-label">05 · Contact</span>
      <div class="section-line"></div>
    </div>

    <div class="contact-grid">
      <div class="contact-left">
        <h2 class="contact-title">
          {{ contactTitle() }}
        </h2>
        <p class="contact-sub">{{ contactSubtitle() }}</p>
      </div>

      <div class="contact-links">
        @for (link of contactLinks(); track $index) {
          <button
            mat-stroked-button
            class="contact-link"
            [matTooltip]="link.tooltip"
            matTooltipClass="contact-tooltip"
          >
            <mat-icon>{{ link.icon }}</mat-icon>
            <div class="link-content">
              <div class="link-label">{{ link.label }}</div>
              <div class="link-value">{{ link.value }}</div>
            </div>
          </button>
        }
      </div>
    </div>
  </div>
</section>
