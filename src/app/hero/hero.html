<section id="hero" class="hero-section">
  <div class="hero">
    <div class="hero-left">
      <div class="hero-tag">
        <span class="tag-dot"></span>
        <span class="tag-text">Software Engineer</span>
        <span class="tag-divider">·</span>
        <span class="tag-company">Deloitte</span>
      </div>

      <h1 class="hero-title">
        {{ heroTitle() }}<br />
        <em>{{ heroHighlight() }}</em><br />
        {{ heroSubtitle() }}
      </h1>

      <p class="hero-description">
        {{ description() }}
      </p>

      <div class="hero-actions">
        <button mat-raised-button class="btn-primary" (click)="navigateToContact()">
          <mat-icon>arrow_forward</mat-icon>
          Get In Touch
        </button>
        <button mat-stroked-button class="btn-ghost" (click)="downloadResume()">
          <mat-icon>download</mat-icon>
          Download CV
        </button>
      </div>

      <div class="hero-stats">
        @for (stat of stats(); track $index) {
          <div class="stat-item">
            <div class="stat-number">{{ stat.number }}</div>
            <div class="stat-label">{{ stat.label }}</div>
          </div>
        }
      </div>
    </div>

    <!-- Hero Image -->
    <div class="hero-image-wrap">
      <div class="img-frame">
        <div class="img-inner">
          <!-- Placeholder Avatar -->
          <div class="avatar-placeholder">
            <img class="avtImage" [src]="heroImage()" alt="Shiv Image" />
          </div>
        </div>
        <!-- Floating badges -->
        <div class="open-to-work">
          <mat-icon class="dot">fiber_manual_record</mat-icon>
          <span class="availableClasss">Open to work</span>
        </div> 
        <div class="float-tag tag-1">TypeScript</div>
        <div class="float-tag tag-2">
          NestJS  🛠
          <div class="aws-icon-container">
            AWS ☁️
          </div>
        </div>
        <div class="total-years-exp">
          <span class="years">{{ totalExp() }}+</span>
          <span class="exp">Yrs experience</span>
        </div>
      </div>

    </div>
  </div>
</section>
