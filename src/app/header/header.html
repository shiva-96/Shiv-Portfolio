<header class="app-header">
  <mat-toolbar class="header-toolbar">
    <div class="logo-container">
      <span class="logo">SHIV<span class="accent">.</span>PRASAD</span>
    </div>

    <!-- Desktop Navigation -->
    <nav class="nav-desktop">
      @for (link of navLinks(); track link.value) {
        <button
          mat-button
          [class.active]="activeLink() === link.value"
          (click)="setActiveLink(link.value)"
          class="nav-link"
        >
          {{ link.label }}
        </button>
      }
    </nav>

    <div class="spacer"></div>

    <!-- Right Section -->
    <div class="header-right">
      <!-- Status Chip -->
      <mat-chip-set aria-label="Status">
        <mat-chip class="status-chip">
          <mat-icon class="dot">fiber_manual_record</mat-icon>
          <span class="availableClasss" >Available</span>
        </mat-chip>
      </mat-chip-set>

      <!-- Resume Button -->
      <button
        [matTooltip]="'Download Resume'"
        matTooltipClass="contact-tooltip"
        mat-raised-button
        class="btn-resume"
        (click)="downloadResume()"
      >
        <mat-icon>download</mat-icon>
        Resume
      </button>

      <!-- Mobile Menu -->
      <button
        mat-icon-button
        class="menu-toggle"
        [matMenuTriggerFor]="mobileMenu"
      >
        <mat-icon>menu</mat-icon>
      </button>

      <mat-menu #mobileMenu="matMenu">
        @for (link of navLinks(); track link.value) {
          <button
            mat-menu-item
            (click)="setActiveLink(link.value)"
          >
            {{ link.label }}
          </button>
        }
      </mat-menu>
    </div>
  </mat-toolbar>
</header>
