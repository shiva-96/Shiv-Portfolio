<section id="skills" class="skills-section">
  <div class="skills-container">
    <div class="section-header">
      <span class="section-label">02 · Skills</span>
      <div class="section-line"></div>
    </div>

    <div class="section-intro">
      <h2 class="section-title">A practical, full-stack toolkit</h2>
      <p class="section-description">
        The languages, frameworks, and cloud services I use to take ideas from interface to production.
      </p>
    </div>

    <div class="skills-grid">
      @for (skill of skills(); track skill.name) {
        <app-skill-card [skill]="skill"></app-skill-card>
      }
    </div>
  </div>
</section>
